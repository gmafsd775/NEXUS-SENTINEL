[build]
builder = "NIXPACKS"

[build.nixpacks]
plan = """
[phases.setup]
nixPackages = ["python311"]

[phases.install]
cmds = [
  "echo 'opencv-python==999.999.999' > /tmp/constraints.txt",
  "pip install -c /tmp/constraints.txt -r requirements.txt"
]

[phases.start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
"""